name: railyard

x-worker: &worker
  image: railyard/worker:${RAILYARD_IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile.worker
    args:
      GO_IMAGE: ${GO_IMAGE:-golang:1.26.6-alpine}
      RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.22}
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  depends_on:
    server:
      condition: service_healthy
  environment:
    RAILYARD_SERVER_URL: ${RAILYARD_SERVER_URL:-http://server:8080}
    RAILYARD_WORKER_SLOTS: ${RAILYARD_WORKER_SLOTS:-16}
    RAILYARD_ALLOW_SHELL: ${RAILYARD_ALLOW_SHELL:-false}
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        kill -0 1 &&
        wget -q -O /dev/null http://server:8080/health/ready
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 10s

services:
  redis:
    image: railyard/redis:${RAILYARD_REDIS_IMAGE_TAG:-7.4-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.redis
      args:
        REDIS_IMAGE: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  server:
    image: railyard/server:${RAILYARD_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.26.6-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.22}
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      redis:
        condition: service_healthy
    command:
      - --listen=${RAILYARD_LISTEN_ADDRESS:-:8080}
      - --db-path=${RAILYARD_DB_PATH:-/var/lib/railyard/railyard.db}
      - --redis-url=${RAILYARD_REDIS_URL:-redis://redis:6379/0}
      - --allow-shell=${RAILYARD_ALLOW_SHELL:-false}
    environment:
      RAILYARD_DB_PATH: ${RAILYARD_DB_PATH:-/var/lib/railyard/railyard.db}
      RAILYARD_REDIS_URL: ${RAILYARD_REDIS_URL:-redis://redis:6379/0}
    volumes:
      - railyard-sqlite:/var/lib/railyard
    ports:
      - "127.0.0.1:${RAILYARD_HTTP_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/health/ready
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker-1:
    <<: *worker
    command:
      - --server-url=${RAILYARD_SERVER_URL:-http://server:8080}
      - --worker-id=worker-1
      - --slots=${RAILYARD_WORKER_SLOTS:-16}
      - --allow-shell=${RAILYARD_ALLOW_SHELL:-false}

  worker-2:
    <<: *worker
    command:
      - --server-url=${RAILYARD_SERVER_URL:-http://server:8080}
      - --worker-id=worker-2
      - --slots=${RAILYARD_WORKER_SLOTS:-16}
      - --allow-shell=${RAILYARD_ALLOW_SHELL:-false}

  worker-3:
    <<: *worker
    command:
      - --server-url=${RAILYARD_SERVER_URL:-http://server:8080}
      - --worker-id=worker-3
      - --slots=${RAILYARD_WORKER_SLOTS:-16}
      - --allow-shell=${RAILYARD_ALLOW_SHELL:-false}

  worker-4:
    <<: *worker
    command:
      - --server-url=${RAILYARD_SERVER_URL:-http://server:8080}
      - --worker-id=worker-4
      - --slots=${RAILYARD_WORKER_SLOTS:-16}
      - --allow-shell=${RAILYARD_ALLOW_SHELL:-false}

  worker-5:
    <<: *worker
    command:
      - --server-url=${RAILYARD_SERVER_URL:-http://server:8080}
      - --worker-id=worker-5
      - --slots=${RAILYARD_WORKER_SLOTS:-16}
      - --allow-shell=${RAILYARD_ALLOW_SHELL:-false}

  worker-6:
    <<: *worker
    command:
      - --server-url=${RAILYARD_SERVER_URL:-http://server:8080}
      - --worker-id=worker-6
      - --slots=${RAILYARD_WORKER_SLOTS:-16}
      - --allow-shell=${RAILYARD_ALLOW_SHELL:-false}

  worker-7:
    <<: *worker
    command:
      - --server-url=${RAILYARD_SERVER_URL:-http://server:8080}
      - --worker-id=worker-7
      - --slots=${RAILYARD_WORKER_SLOTS:-16}
      - --allow-shell=${RAILYARD_ALLOW_SHELL:-false}

  worker-8:
    <<: *worker
    command:
      - --server-url=${RAILYARD_SERVER_URL:-http://server:8080}
      - --worker-id=worker-8
      - --slots=${RAILYARD_WORKER_SLOTS:-16}
      - --allow-shell=${RAILYARD_ALLOW_SHELL:-false}

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    user: "65534:65534"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      server:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:9090/-/healthy
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.1.0}
    user: "472:0"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-railyard-local}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_LOG_MODE: console
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:3000/api/health
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  railyard-sqlite:
  redis-data:
  prometheus-data:
  grafana-data:
